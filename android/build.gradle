allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 36
                buildToolsVersion "36.0.0"
                
                // Set namespace for plugins that don't have one
                if (project.android.namespace == null) {
                    if (project.name == 'device_info_plus') {
                        project.android.namespace = 'dev.fluttercommunity.plus.device_info'
                    } else if (project.name == 'file_picker') {
                        project.android.namespace = 'com.mr.flutter.plugin.filepicker'
                    } else if (project.name == 'package_info_plus') {
                        project.android.namespace = 'dev.fluttercommunity.plus.packageinfo'
                    } else if (project.name == 'permission_handler_android') {
                        project.android.namespace = 'com.baseflow.permissionhandler'
                    } else {
                        project.android.namespace = project.group ?: "com.example.${project.name}"
                    }
                }
                
                defaultConfig {
                    minSdkVersion 24
                }
                
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                
                if (project.hasProperty('kotlin')) {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
